name: SDK, tools, and emulator tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux emulator dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev pkg-config
      - name: Install macOS emulator dependencies
        if: runner.os == 'macOS'
        run: brew install sdl2 pkg-config
      - name: Run SDK, packaging, CLI, and USB tests
        run: |
          make test
          make usb-test
      - name: Build and test Emulator2
        run: bash tools/build/emulator_unix.sh --test

  windows-target-build:
    name: Windows native u'nSP build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          location: C:\msys64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2
      - name: Build the canonical system MBA with native Generalplus tools
        shell: pwsh
        run: .\scripts\build_and_run.ps1 -NoLaunch
      - name: Run the canonical native-Windows test baseline
        env:
          MOBIGO_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: python tools/mobigo.py test

  documentation:
    name: Documentation and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r docs/requirements.txt
      - run: make docs-check
